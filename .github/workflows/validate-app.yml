name: Validate Clarity App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Requirements
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: |
          cp .env.example .env
          # Add dummy API key for build testing
          echo "ANTHROPIC_API_KEY=sk-ant-test-key-for-ci" >> .env

      - name: Start services
        run: |
          docker-compose up -d
          # Wait for services to be ready
          sleep 30

      - name: Wait for backend health check
        run: |
          echo "Waiting for backend to be healthy..."
          for i in {1..30}; do
            if curl -f http://localhost:8000/health; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "Attempt $i/30 failed, waiting 2s..."
            sleep 2
          done
          echo "Backend health check failed after 60 seconds"
          docker-compose logs backend
          exit 1

      - name: Run validation script
        run: |
          python scripts/validate-app.py
        env:
          BACKEND_URL: http://localhost:8000

      - name: Check logs for errors
        if: failure()
        run: |
          echo "=== Backend Logs ==="
          docker-compose logs backend
          echo "=== Frontend Logs ==="
          docker-compose logs frontend
          echo "=== Database Logs ==="
          docker-compose logs postgres

      - name: Stop services
        if: always()
        run: |
          docker-compose down -v

  lint-backend:
    name: Lint Backend Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 black

      - name: Lint with flake8
        run: |
          cd backend
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

      - name: Check formatting with black
        run: |
          cd backend
          black --check --diff .
        continue-on-error: true

  lint-frontend:
    name: Lint Frontend Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint with ESLint
        run: |
          cd frontend
          npm run lint
        continue-on-error: true

      - name: Type check with TypeScript
        run: |
          cd frontend
          npm run type-check
        continue-on-error: true

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Create .env file
        run: |
          cp .env.example .env
          echo "ANTHROPIC_API_KEY=sk-ant-test-key" >> .env

      - name: Start services
        run: |
          docker-compose up -d
          sleep 20

      - name: Run backend tests
        run: |
          docker-compose exec -T backend pytest -v
        continue-on-error: true

      - name: Stop services
        if: always()
        run: |
          docker-compose down -v

  build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: |
          cp .env.example .env
          echo "ANTHROPIC_API_KEY=sk-ant-test-key" >> .env

      - name: Build backend
        run: |
          docker-compose build backend

      - name: Build frontend
        run: |
          docker-compose build frontend

      - name: Build summary
        run: |
          echo "✅ All Docker images built successfully"

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [validate, lint-backend, lint-frontend, test-backend, build-check]
    if: always()

    steps:
      - name: Check validation results
        run: |
          echo "=== Validation Summary ==="
          echo "Validate: ${{ needs.validate.result }}"
          echo "Lint Backend: ${{ needs.lint-backend.result }}"
          echo "Lint Frontend: ${{ needs.lint-frontend.result }}"
          echo "Test Backend: ${{ needs.test-backend.result }}"
          echo "Build Check: ${{ needs.build-check.result }}"

          if [ "${{ needs.validate.result }}" != "success" ]; then
            echo "❌ Critical validation failed"
            exit 1
          fi

          echo "✅ All critical checks passed!"
